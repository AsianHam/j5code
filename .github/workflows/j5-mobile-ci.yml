name: J5 Mobile CI

# Native mobile checks upstream's ci.yml runs only in pingdotgg/t3code. Both
# jobs are advisory: they are not part of the required "Format, lint,
# typecheck, and unit tests" check, and each runs only when its inputs change.

on:
  push:
    branches:
      - "j5/**"
  pull_request:
    branches:
      - "j5/**"

permissions:
  contents: read

concurrency:
  group: j5-mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Mobile native changes
    if: github.repository == 'Jacksondr5/j5code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.detect.outputs.lint }}
      build: ${{ steps.detect.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Credentials stay until the post step: removing them inside checkout runs
          # `git submodule foreach`, which fails on the vendored gitlinks under .repos.
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect native inputs
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # An unknown base (new branch, force push) runs both jobs rather than
          # silently skipping them.
          # A pull request compares against its merge base; a push compares the
          # two push tips, so a force push that drops native changes still counts.
          range=("$BASE_SHA" HEAD)
          [[ "$EVENT_NAME" == "pull_request" ]] && range=("$BASE_SHA...HEAD")
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! paths=$(git diff --name-only "${range[@]}"); then
            echo "Could not resolve the changed files; running every mobile native check."
            echo "lint=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          report() {
            if grep -qE "$2" <<< "$paths"; then
              echo "$1 inputs changed:"
              grep -E "$2" <<< "$paths"
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # Sources and configuration scripts/mobile-native-static-check.ts lints.
          report lint '^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^\.github/workflows/j5-mobile-ci\.yml$'
          # Inputs to the native iOS project, including the root icons app.config
          # resolves through brand-assets. A Debug simulator build does not
          # bundle JavaScript, so screen and state changes cannot break it.
          report build '^apps/mobile/(app\.config\.ts|eas\.json|package\.json|plugins/|modules/|assets/)|^assets/|^pnpm-lock\.yaml$|^scripts/lib/(j5-branding|brand-assets|public-config)\.ts$|^\.github/workflows/j5-mobile-ci\.yml$'

      # These gitlinks belong to vendored manifests, not this repository.
      # Remove them only from the disposable index before checkout's cleanup.
      - name: Exclude vendored gitlinks from checkout cleanup
        if: always()
        run: |
          python3 - <<'PYTHON'
          import subprocess
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z", ".repos"])
          paths = [entry.split(b"\t", 1)[1] for entry in entries.split(b"\0") if entry.startswith(b"160000 ")]
          if paths:
              subprocess.run(["git", "update-index", "--force-remove", "-z", "--stdin"], input=b"\0".join(paths) + b"\0", check=True)
          PYTHON

  native_lint:
    name: Mobile native static analysis
    needs: changes
    # Skip only on an explicit "no"; a failed detection job still runs the check.
    if: ${{ !cancelled() && needs.changes.outputs.lint != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install native lint tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: pnpm exec vp run lint:mobile

      # These gitlinks belong to vendored manifests, not this repository.
      # Remove them only from the disposable index before checkout's cleanup.
      - name: Exclude vendored gitlinks from checkout cleanup
        if: always()
        run: |
          python3 - <<'PYTHON'
          import subprocess
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z", ".repos"])
          paths = [entry.split(b"\t", 1)[1] for entry in entries.split(b"\0") if entry.startswith(b"160000 ")]
          if paths:
              subprocess.run(["git", "update-index", "--force-remove", "-z", "--stdin"], input=b"\0".join(paths) + b"\0", check=True)
          PYTHON

  ios_build:
    name: iOS simulator build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      EXPO_NO_GIT_STATUS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform ios

      # Build what prebuild generated, so a rename (like T3CodeDev → J5CodeDev)
      # is exercised rather than assumed. The vendored GhosttyKit framework has
      # only an arm64 simulator slice, so the build targets arm64 alone.
      - name: Build for the iOS simulator
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' ! -name 'Pods.xcworkspace' | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -quiet \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      # These gitlinks belong to vendored manifests, not this repository.
      # Remove them only from the disposable index before checkout's cleanup.
      - name: Exclude vendored gitlinks from checkout cleanup
        if: always()
        run: |
          python3 - <<'PYTHON'
          import subprocess
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z", ".repos"])
          paths = [entry.split(b"\t", 1)[1] for entry in entries.split(b"\0") if entry.startswith(b"160000 ")]
          if paths:
              subprocess.run(["git", "update-index", "--force-remove", "-z", "--stdin"], input=b"\0".join(paths) + b"\0", check=True)
          PYTHON
