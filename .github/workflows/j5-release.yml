name: J5 Release

# Publishes one J5 Code release to this repository's GitHub Releases:
#   - the signed and notarized macOS desktop build from a successful
#     "J5 Signed macOS Build" run (DMG, ZIP, blockmaps, updater metadata);
#   - self-contained CLI archives for darwin-arm64 (Developer ID signed and
#     notarized) and linux-x64, built here from the same source commit with
#     upstream's scripts/build-cli-archive.ts;
#   - SHA256SUMS over the CLI archives and scripts/install.sh, which
#     `curl -fsSL https://github.com/Jacksondr5/j5code/releases/latest/download/install.sh | sh`
#     fetches. packages/shared/src/cliRelease.ts, the installer, `j5 update`,
#     the background service, and SSH remote launch all download from here.
# J5 no longer publishes to npm (FORK.md release-archive case).
#
# A build whose version is `<x.y.z>-preview.<yyyymmdd>.<n>` publishes a preview:
# a GitHub pre-release that never becomes "latest", so the stable installer
# URL, `j5 update`, and desktop updates never pick it up. Maintainers cut one
# from an unmerged branch to test installs and updates before a release; see
# docs/j5/runbooks/macos-packaging.md.
#
# A version `<x.y.z>-nightly.<yyyymmdd>.<n>` publishes a nightly: also a
# pre-release that never becomes "latest", but with `nightly-mac.yml`, the feed
# desktop apps on the nightly update track follow. Nightlies come only from J5
# Nightly, and stable releases only from J5 Stable, which promotes a nightly.
# Both call this workflow with a commit and a date version
# (scripts/j5/release-version.ts); the version is then stamped into the
# manifests at build time instead of being read from them, and the desktop
# build is the one the caller made earlier in the same run. A manual run
# publishes only a preview, at the version its branch commits.
#
# No checkout here sets `persist-credentials: false`: it makes checkout fail on
# the vendored gitlinks (FORK.md, "J5 CI and packaging"). The one job with a
# write token, `release`, runs no code from the repository, and the jobs that
# do run repository code hold a read-only token.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful J5 Signed macOS Build run to publish
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit to publish; the calling run built the desktop app from it
        type: string
        required: true
      version:
        description: Version to stamp and publish
        type: string
        required: true
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: j5-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
      stamp: ${{ steps.source.outputs.stamp }}
      published: ${{ steps.source.outputs.published }}
    steps:
      - uses: actions/github-script@v8
        id: source
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          CALL_REF: ${{ inputs.ref }}
          CALL_VERSION: ${{ inputs.version }}
        with:
          script: |
            // Every package version the release scripts align upstream must agree.
            const paths = [
              'apps/server/package.json',
              'apps/desktop/package.json',
              'apps/web/package.json',
              'packages/contracts/package.json',
            ];
            // A caller names the commit and the version, which the build jobs stamp.
            // A manual run publishes a finished build at the version its commit carries.
            const stamp = Boolean(process.env.CALL_VERSION);
            let sha;
            let version;
            if (stamp) {
              ({ data: { sha } } = await github.rest.repos.getCommit({ ...context.repo, ref: process.env.CALL_REF }));
              version = process.env.CALL_VERSION;
            } else {
              if (!/^\d+$/.test(process.env.BUILD_RUN_ID)) throw new Error('A numeric build run ID is required.');
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: Number(process.env.BUILD_RUN_ID),
              });
              // run.path can carry an `@ref` suffix; compare the workflow file alone.
              if (run.conclusion !== 'success' || run.path?.split('@', 1)[0] !== '.github/workflows/j5-macos-build.yml') {
                throw new Error('Select a successful J5 Signed macOS Build run.');
              }
              sha = run.head_sha;
              const versions = await Promise.all(paths.map(async path => {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: sha });
                return JSON.parse(Buffer.from(data.content, 'base64').toString()).version;
              }));
              if (versions.some(candidate => candidate !== versions[0])) {
                throw new Error(`This workflow requires one version across ${paths.join(', ')}; found ${versions.join(', ')}.`);
              }
              version = versions[0];
            }
            // The preview and nightly patterns are the ones packages/shared/src/cliRelease.ts
            // and scripts/build-desktop-artifact.ts recognise.
            const channel = /^\d+\.\d+\.\d+$/.test(version) ? 'stable'
              : /^\d+\.\d+\.\d+-preview\.\d{8}\.\d+$/.test(version) ? 'preview'
              : /^\d+\.\d+\.\d+-nightly\.\d{8}\.\d+$/.test(version) ? 'nightly'
              : null;
            if (channel === null) {
              throw new Error(`This workflow requires a stable (x.y.z), preview (x.y.z-preview.<date>.<n>) or nightly (x.y.z-nightly.<date>.<n>) version; found ${version}.`);
            }
            // A nightly reaches every install on the nightly track and a stable release every
            // install, so they come only from J5 Nightly, which builds j5/main, and J5 Stable,
            // which promotes a nightly. A manual run never publishes one, whatever version the
            // branch commits.
            if (!stamp && channel !== 'preview') {
              throw new Error(`A manual J5 Release publishes only a preview; nightlies come from J5 Nightly and stable releases from J5 Stable. Found ${version}.`);
            }
            if (stamp && channel === 'preview') {
              throw new Error(`A calling workflow publishes a nightly or a stable release; found ${version}.`);
            }
            // Nightly and stable versions are dates (scripts/j5/release-version.ts). Anything
            // else would sort below every date version and never be offered as an update.
            if (stamp && !/^\d{6}\.([1-9]|[12]\d|3[01])\.\d+(-|$)/.test(version)) {
              throw new Error(`A nightly or stable version is <yyyymm>.<d>.<n>; found ${version}.`);
            }
            // Release archives replace the npm package from 0.0.44 on; an older
            // version number would be offered as a downgrade to every installed
            // J5 and would collide with the npm-era tags.
            const [major, minor, patch] = version.split('-', 1)[0].split('.').map(Number);
            if (major === 0 && minor === 0 && patch < 44) {
              throw new Error(`J5 release archives start at 0.0.44; ${version} belongs to the npm era.`);
            }
            // A published release that already carries SHA256SUMS is final:
            // rebuilding would change archive bytes under existing checksums.
            // An existing release for this version must come from the same
            // commit. A mismatch means a preview's version was not bumped, or
            // a nightly whose number another nightly already took as a stable
            // release is being promoted, so fail rather than report "already
            // published".
            const tag = `v${version}`;
            let published = false;
            let release = null;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release !== null) {
              let tagSha = null;
              try {
                // Same resolution as the publish job: commits/<tag> dereferences annotated tags.
                ({ data: { sha: tagSha } } = await github.rest.repos.getCommit({ ...context.repo, ref: tag }));
              } catch (error) {
                // A draft release may not have created its tag yet.
                if (error.status !== 404 && error.status !== 422) throw error;
              }
              if (tagSha !== null && tagSha !== sha) {
                throw new Error(`Release ${tag} already exists at ${tagSha}, but this build is ${sha}. ${channel === 'stable' ? 'Promote a newer nightly.' : 'Bump the version before releasing.'}`);
              }
              published = tagSha === sha && !release.draft && release.assets.some(asset => asset.name === 'SHA256SUMS');
            }
            core.setOutput('ref', sha);
            core.setOutput('version', version);
            core.setOutput('channel', channel);
            core.setOutput('stamp', String(stamp));
            core.setOutput('published', String(published));
            core.notice(published
              ? `J5 Code ${version} is already published; nothing to do.`
              : `Publishing J5 Code ${version}${channel === 'stable' ? '' : ` as a ${channel}`} from ${sha}.`);

  verify:
    needs: resolve
    if: needs.resolve.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test release, installer, update, service, and SSH behavior
        run: >-
          pnpm exec vp test run
          packages/shared/src/cliRelease.test.ts
          scripts/install.test.ts
          apps/server/src/cloud/pinnedRuntime.test.ts
          apps/server/src/cloud/selfUpdate.test.ts
          apps/server/src/cloud/bootService.test.ts
          apps/server/src/cli/service.test.ts
          apps/server/src/serviceLauncher.test.ts
          packages/ssh/src/command.test.ts
          packages/ssh/src/tunnel.test.ts

      # These gitlinks belong to vendored manifests, not this repository.
      # Remove them only from the disposable index before checkout's cleanup.
      - name: Exclude vendored gitlinks from checkout cleanup
        if: always()
        run: |
          python3 - <<'PYTHON'
          import subprocess
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z", ".repos"])
          paths = [entry.split(b"\t", 1)[1] for entry in entries.split(b"\0") if entry.startswith(b"160000 ")]
          if paths:
              subprocess.run(["git", "update-index", "--force-remove", "-z", "--stdin"], input=b"\0".join(paths) + b"\0", check=True)
          PYTHON

  monitors:
    needs: resolve
    if: needs.resolve.outputs.published != 'true'
    uses: ./.github/workflows/j5-resource-monitors.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  cli_archive:
    needs: [resolve, verify, monitors]
    if: needs.resolve.outputs.published != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: mac
            arch: arm64
            key: darwin-arm64
            runner: macos-14
          - platform: linux
            arch: x64
            key: linux-x64
            runner: ubuntu-24.04
    name: CLI archive ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp the release version
        if: needs.resolve.outputs.stamp == 'true'
        run: pnpm exec node scripts/update-release-package-versions.ts "$RELEASE_VERSION"

      - name: Build server and web client
        run: pnpm exec vp run --filter t3 build

      # `cli.ts build` stamps the development icons into dist/client; the
      # archive serves that directory, so swap in the production J5 icons.
      - name: Apply production web brand assets to the bundled client
        run: pnpm exec node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      # Node single-executables need a host Node with --build-sea (25.7+).
      # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts and
      # VP_NODE_VERSION in upstream's release-desktop.yml.
      - uses: actions/setup-node@v6
        with:
          node-version: 26.8.2

      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: 26.8.2
        run: pnpm exec node apps/server/scripts/cli.ts build-exe --verbose

      # The executable embeds this Node, and CI tests on the one in .nvmrc. They
      # differ in `node:sqlite`: the first nightly could not take its
      # pre-migration snapshot, so its server would not start on a database with
      # pending migrations. These tests open, copy and migrate real database
      # files. `vp test run` uses the `node` on PATH (VP_NODE_VERSION does not
      # move it), so the first line fails the step if that is not the embedded
      # version.
      - name: Run the database startup tests on the Node the executable embeds
        working-directory: apps/server
        run: |
          test "$(node --version)" = "v26.8.2"
          pnpm exec vp test run src/j5/persistence src/persistence

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: j5-resource-monitor-${{ matrix.key }}
          path: ${{ runner.temp }}/cli-resource-monitor/${{ matrix.key }}

      - name: Stage resource monitor
        run: chmod +x "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}/t3-resource-monitor"

      - name: Prepare Apple signing credentials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: bash scripts/j5/prepare-macos-signing.sh

      # prepare-macos-signing.sh leaves CSC_LINK pointing at a keychain-compatible
      # re-export of the certificate; build-cli-archive.ts signs with the
      # identity named here and notarizes with APPLE_API_KEY*.
      - name: Import the Developer ID identity for the CLI
        if: matrix.platform == 'mac'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$J5_SIGNING_DIR/j5-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$CSC_LINK" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "T3CODE_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build CLI archive
        env:
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: >-
          pnpm exec node scripts/build-cli-archive.ts
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --version "$RELEASE_VERSION"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir release-cli

      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/j5-cli.XXXXXX")"
          tar -xzf "release-cli/t3-$RELEASE_VERSION-darwin-arm64.tar.gz" -C "$scratch" --strip-components=1
          codesign --verify --strict --verbose=2 "$scratch/j5"
          details="$(codesign -dv --verbose=4 "$scratch/j5" 2>&1)"
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$details"
          grep -E '^CodeDirectory .*flags=0x[0-9a-f]*\(runtime\)' <<<"$details"

      - name: Smoke-test CLI archive
        run: pnpm exec node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$RELEASE_VERSION-${{ matrix.key }}.tar.gz" --expect-version "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: j5-cli-${{ matrix.key }}
          path: release-cli/t3-*-${{ matrix.key }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: ${{ always() && matrix.platform == 'mac' }}
        run: |
          if [[ -n "${J5_SIGNING_DIR:-}" ]]; then
            security delete-keychain "$J5_SIGNING_DIR/j5-cli-signing.keychain-db" 2>/dev/null || true
            rm -rf -- "$J5_SIGNING_DIR"
          fi

      # These gitlinks belong to vendored manifests, not this repository.
      # Remove them only from the disposable index before checkout's cleanup.
      - name: Exclude vendored gitlinks from checkout cleanup
        if: always()
        run: |
          python3 - <<'PYTHON'
          import subprocess
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z", ".repos"])
          paths = [entry.split(b"\t", 1)[1] for entry in entries.split(b"\0") if entry.startswith(b"160000 ")]
          if paths:
              subprocess.run(["git", "update-index", "--force-remove", "-z", "--stdin"], input=b"\0".join(paths) + b"\0", check=True)
          PYTHON

  release:
    needs: [resolve, cli_archive]
    if: needs.resolve.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.ref }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: j5-code-signed-macos-arm64
          # A caller built the desktop app earlier in this same run.
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          pattern: j5-cli-*
          path: release-assets
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          test -f "release-assets/J5-Code-$RELEASE_VERSION-arm64.dmg"
          test -f "release-assets/J5-Code-$RELEASE_VERSION-arm64.zip"
          # Each channel carries its own update feed and no other: a stray
          # `latest-mac.yml` or `nightly-mac.yml` is what would let an install on
          # another track update onto this release. A preview has no feed at all.
          case "$RELEASE_CHANNEL" in
            stable) feed=latest-mac.yml ;;
            nightly) feed=nightly-mac.yml ;;
            preview) feed= ;;
            *) echo "Unknown release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          for candidate in latest-mac.yml nightly-mac.yml; do
            if [[ "$candidate" == "$feed" ]]; then
              grep -Fx "version: $RELEASE_VERSION" "release-assets/$candidate"
            else
              test ! -e "release-assets/$candidate"
            fi
          done
          archives=(
            "t3-$RELEASE_VERSION-darwin-arm64.tar.gz"
            "t3-$RELEASE_VERSION-linux-x64.tar.gz"
          )
          for archive in "${archives[@]}"; do
            test -f "release-assets/$archive"
          done
          cp scripts/install.sh release-assets/install.sh
          # Checksums come from the exact bytes being uploaded.
          (cd release-assets && sha256sum "${archives[@]}" install.sh > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if tag_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null)"; then
            test "$tag_sha" = "$RELEASE_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$RELEASE_CHANNEL" == nightly ]]; then
              cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          J5 Code $RELEASE_VERSION (nightly)

          Built from \`j5/main\` for daily use ahead of a stable release. It can break, and its fix is the next nightly. An update can change the database in ways an older version cannot read, so going back to an older version means restoring the snapshot the server takes before it migrates (docs/j5/runbooks/macos-packaging.md).

          - Command-line server, fresh install:
            \`curl -fsSL https://github.com/$GH_REPO/releases/download/$tag/install.sh | T3CODE_CHANNEL=nightly sh\`
          - Command-line server, from an installed \`j5\`: \`j5 update --channel nightly\`. It then follows nightlies.
          - macOS app: in an installed J5 Code, Settings, Update track, Nightly. Or install the DMG below. It installs as "J5 Code (Nightly)" beside "J5 Code" and follows nightlies. The two share one profile and one database, so run only one of them at a time.

          Built from $RELEASE_SHA.
          EOF
            elif [[ "$RELEASE_CHANNEL" == preview ]]; then
              cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          J5 Code $RELEASE_VERSION (preview)

          A maintainers' test build cut from an unreleased branch. It can be broken, gets no fixes, and is never offered as an update.

          - Command-line server, fresh install:
            \`curl -fsSL https://github.com/$GH_REPO/releases/download/$tag/install.sh | T3CODE_VERSION=$RELEASE_VERSION sh\`
          - Command-line server, from an installed \`j5\`: \`j5 update $RELEASE_VERSION\` in a terminal.
          - macOS app: the DMG below. It replaces an installed J5 Code and never updates itself; reinstall a stable DMG to go back.

          Built from $RELEASE_SHA.
          EOF
            else
              cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          J5 Code $RELEASE_VERSION

          - macOS Apple Silicon app, Developer ID signed and notarized by Apple.
          - Command-line server for macOS (Apple silicon, signed and notarized) and Linux x64:
            \`curl -fsSL https://github.com/Jacksondr5/j5code/releases/latest/download/install.sh | sh\`,
            then \`j5\`. \`SHA256SUMS\` covers the archives and the installer.
          - Upgrading a server installed from npm (0.0.43 or earlier)? See docs/user/migrating-to-release-archives.md.
          - ZIP, blockmaps, and update metadata support desktop updates.

          Built from $RELEASE_SHA.
          EOF
            fi
            # Marked from the start: a draft left behind by a failed run must not
            # become "latest" if someone publishes it by hand.
            prerelease=()
            if [[ "$RELEASE_CHANNEL" != stable ]]; then prerelease=(--prerelease); fi
            gh release create "$tag" --target "$RELEASE_SHA" --title "J5 Code $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --draft "${prerelease[@]}"
          fi
          gh release upload "$tag" release-assets/* --clobber
          # A preview or nightly must never become "latest": the stable installer
          # URL and stable desktop updates resolve through it.
          if [[ "$RELEASE_CHANNEL" != stable ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --latest
          fi

      # These gitlinks belong to vendored manifests, not this repository.
      # Remove them only from the disposable index before checkout's cleanup.
      - name: Exclude vendored gitlinks from checkout cleanup
        if: always()
        run: |
          python3 - <<'PYTHON'
          import subprocess
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z", ".repos"])
          paths = [entry.split(b"\t", 1)[1] for entry in entries.split(b"\0") if entry.startswith(b"160000 ")]
          if paths:
              subprocess.run(["git", "update-index", "--force-remove", "-z", "--stdin"], input=b"\0".join(paths) + b"\0", check=True)
          PYTHON
